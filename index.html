<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Patadita de la Suerte — Misión Aguinaldos</title>
<style>
:root{--red:#d4141c;--green:#0b7a3b;--gold:#f5c542;--dark:#0d1b2a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--dark);color:#fff;font-family:"Courier New",monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;background:var(--red);font-weight:bold;font-size:14px;border-bottom:3px solid var(--gold)}
#hud button{background:none;border:2px solid #fff;color:#fff;border-radius:4px;font-size:16px;padding:2px 6px;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{touch-action:none;display:block;border:3px solid var(--gold);border-radius:4px}
#ui{padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px}
.btn{font:bold 15px "Courier New",monospace;padding:12px 16px;border:3px solid #fff;background:var(--green);color:#fff;border-radius:6px;box-shadow:0 4px 0 #04381b;cursor:pointer;text-transform:uppercase}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #04381b}
.btn.red{background:var(--red);box-shadow:0 4px 0 #7a0a0e}
.btn.gold{background:var(--gold);color:#5a0000;box-shadow:0 4px 0 #a07a10}
.btn.opt{flex:1 1 100%;padding:9px;font-size:14px;text-transform:none}
.btn.pad{width:64px;height:52px;font-size:22px;padding:0}
.pad-grid{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%,#1f3b5c,var(--dark));z-index:5}
.hidden{display:none!important}
.logo{max-width:220px;max-height:110px;background:#fff;border-radius:8px;padding:6px 10px}
.logo-ph{border:2px dashed var(--gold);color:var(--gold);padding:14px 20px;font-size:13px}
h1{font-size:26px;color:var(--gold);text-shadow:3px 3px 0 var(--red);line-height:1.15}
h2{font-size:18px;color:#fff;letter-spacing:2px}
.jimg{width:100px;image-rendering:pixelated}
input{font:bold 20px "Courier New",monospace;padding:10px;width:240px;text-align:center;border:3px solid var(--gold);border-radius:6px;background:#fff;color:#000}
.small{font-size:12px;opacity:.8;max-width:320px}
.big{font-size:34px;color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="hidden"><span id="hA"></span><span id="hF"></span><span id="hS"></span><button id="mute" aria-label="Sonido">🔊</button></div>
  <div id="stage"><canvas id="cv" width="360" height="480"></canvas></div>
  <div id="ui"></div>

  <div id="sTitle" class="screen">
    <img class="logo" src="assets/logo-tropicana.png" alt="Tropicana" onerror="this.outerHTML='<div class=logo-ph>LOGO TROPICANA<br>(assets/logo-tropicana.png)</div>'">
    <h1>LA PATADITA<br>DE LA SUERTE</h1>
    <h2>★ MISIÓN AGUINALDOS ★</h2>
    <img class="jimg" id="jImg" alt="Jorge Barón">
    <button class="btn gold" id="bPlay">JUGAR</button>
    <p class="small">Supera los 5 pisos del edificio navideño y llega a la tarima.</p>
  </div>

  <div id="sReg" class="screen hidden">
    <h2>¿CÓMO TE LLAMAMOS?</h2>
    <input id="alias" maxlength="12" placeholder="Tu alias" autocomplete="off">
    <button class="btn gold" id="bGo">¡A JUGAR!</button>
    <p class="small">Solo alias. No pedimos datos personales. Se guarda únicamente en este navegador.</p>
  </div>

  <div id="sEnd" class="screen hidden">
    <h1>¡MISIÓN CUMPLIDA!</h1>
    <h2 id="rA"></h2>
    <div class="big" id="rS"></div>
    <p id="rB" class="small"></p>
    <button class="btn red" id="bRe">REINICIAR</button>
  </div>
</div>

<script>
'use strict';
// ================== BASE ==================
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),W=360,H=480,ui=$('ui');
cx.imageSmoothingEnabled=false;
const G={alias:'',score:0,floor:0,muted:false,b5:false};
let scene=null,T=0,DT=0;
const logo=new Image();logo.src='assets/logo-tropicana.png';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
G.muted=store.get('patadita_mute',false);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let R=2;function fit(){const st=$('stage');const s=Math.min((st.clientWidth-8)/W,(st.clientHeight-8)/H),cw=W*s|0;cv.style.width=cw+'px';cv.style.height=(H*s|0)+'px';
  let r=Math.ceil(cw*(window.devicePixelRatio||1)/W);r=r<=2?2:4;if(cv.width!==W*r){R=r;cv.width=W*R;cv.height=H*R}cx.setTransform(R,0,0,R,0,0)}
addEventListener('resize',fit);
new ResizeObserver(fit).observe($('stage'));

function btn(label,cls,fn,parent){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.onclick=()=>{ac();fn(b)};(parent||ui).appendChild(b);return b}
function setScene(s){scene=s;ui.innerHTML='';s.init&&s.init();hud()}
function show(id){['sTitle','sReg','sEnd'].forEach(s=>$(s).classList.toggle('hidden',s!==id));$('hud').classList.toggle('hidden',!!id)}
function hud(){$('hA').textContent='🎄 '+G.alias;$('hF').textContent=G.floor<5?`PISO ${G.floor+1}/5`:'AZOTEA';$('hS').textContent='★ '+G.score;$('mute').textContent=G.muted?'🔇':'🔊'}

// input
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{ac();const p=cpos(e);scene&&scene.down&&scene.down(p.x,p.y)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){const p=cpos(e);scene&&scene.move&&scene.move(p.x,p.y)}});
cv.addEventListener('pointerup',e=>{const p=cpos(e);scene&&scene.up&&scene.up(p.x,p.y)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(scene&&scene.key){scene.key(e.key,true);if(e.key.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>scene&&scene.key&&scene.key(e.key,false));

// ================== AUDIO (Web Audio, música original) ==================
let AC=null,master=null,bus=null,nbuf=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=G.muted?0:.6;master.connect(AC.destination);
  nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type,v,dest){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,dest){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.02)}
function drum(t,dest,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);g.gain.setValueAtTime(v||.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+.3)}
function stopMusic(){if(bus){bus.disconnect();bus=null}}
function newBus(){stopMusic();bus=AC.createGain();bus.connect(master);return bus}
function sfx(n){if(!ac())return;const t=AC.currentTime;const f={
  good:()=>{tone(988,t,.08);tone(1319,t+.08,.18)},bad:()=>tone(140,t,.3,'sawtooth',.12),
  flip:()=>tone(660,t,.06,'square',.07),step:()=>tone(520,t,.05,'square',.05),
  win:()=>[72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*.1,.25,'square',.12)),
  kick:()=>{drum(t,0,.8);noise(t,.15,.3)},ding:()=>{tone(1568,t,.5,'triangle',.18);tone(2093,t+.12,.5,'triangle',.12)}}[n];f&&f()}
function playTropical(){if(!ac())return;const b=newBus(),q=60/104,t0=AC.currentTime+.1;
  const CH=[[43,47,50],[48,52,55],[50,54,57],[43,47,50],[40,43,47],[48,52,55],[50,54,57],[43,47,50]];
  const MEL=[[[71,.5],[74,.5],[79,1],[78,.5],[76,.5],[74,1]],[[72,.5],[76,.5],[79,1],[76,1],[72,1]],[[74,.5],[78,.5],[81,1],[79,.5],[78,.5],[76,1]],[[79,1.5],[74,.5],[71,2]],
             [[76,.5],[79,.5],[83,1],[81,.5],[79,.5],[76,1]],[[76,.5],[79,.5],[84,1],[83,.5],[81,.5],[79,1]],[[78,.5],[79,.5],[81,.5],[78,.5],[74,1],[76,.5],[78,.5]],[[79,2],[0,2]]];
  for(let rep=0;rep<2;rep++)for(let bar=0;bar<8;bar++){const t=t0+(rep*8+bar)*4*q,c=CH[bar];
    tone(mf(c[0]),t,q*.9,'triangle',.35,b);tone(mf(c[2]),t+2*q,q*.9,'triangle',.3,b);tone(mf(c[0]+12),t+3.5*q,q*.4,'triangle',.25,b);
    for(let e=0;e<8;e++)noise(t+e*q/2,.05,e%2?.12:.05,b);
    drum(t+q,b,.35);drum(t+3*q,b,.35);
    [.5,1.5,2.5,3.5].forEach(k=>c.forEach(m=>tone(mf(m+12),t+k*q,.12,'square',.025,b)));
    let mt=t;MEL[bar].forEach(([m,d])=>{if(m){tone(mf(m),mt,d*q*.9,'square',.07,b);tone(mf(m+12),mt,.2,'triangle',.04,b)}mt+=d*q});
  }}
$('mute').onclick=()=>{G.muted=!G.muted;store.set('patadita_mute',G.muted);if(master)master.gain.value=G.muted?0:.6;hud()};

// ================== SPRITES PIXEL ART ==================
const PAL={S:'#eef0f2',s:'#a9b0b8',K:'#d99a6c',k:'#9a5e3a',g:'#b8c0ca',M:'#6a1010',B:'#1a1a1a',W:'#ffffff',w:'#c3cad3',R:'#d4141c',H:'#2a1a10',C:'#0b7a3b',P:'#1c2c4c'};
const J_HEAD=['.......ssSSSs.......','.....sSSSSSSSSs.....','....sSSSSSSSSSSs....','...sSSSSSSSSSSSSs...','...sSKKKKKKKKKKSs...','...sKssKKKKKKssKs...','...KKBWKKKKKKBWKK...','..kKKKKKKKKKKKKKKk..','...KKKKKKkkKKKKKK...','...KKKMWWWWWWMKKK...','....KKMWWWWWWMKK....','.....KKMMMMMMKK.....','......KKKKKKKK......'];
const J_BODY=['.......wWWWWw.......','....WWWgWWWWgWWW....','..WWWWWgWWWWgWWWWW..','.WWWWWWgWWWWgWWWWWW.','.WWwWWWWgWWgWWWWwWW.','.WWwWWWWWggWWWWWwWW.','.WWwWWWWWWWWWWWWwWW.','.KKwWWWWWgWWWWWWwKK.','.KK.WWWWWgWWWWWW.KK.','....WWWWWgWWWWWW....','....wWWWWWWWWWWw....'];
const J_ARMS=['.KK....wWWWWw....KK.','.KKWWWWgWWWWgWWWWKK.','..WWWWWgWWWWgWWWWW..','...WWWWgWWWWgWWWW...','...WwWWWgWWgWWWwW...','...WwWWWWggWWWWwW...','...WwWWWWWWWWWWwW...','...WwWWWWgWWWWWwW...','....WWWWWgWWWWWW....','....WWWWWgWWWWWW....','....wWWWWWWWWWWw....'];
const J_LEGS={idle:['....WWWWW..WWWWW....','....WWWWW..WWWWW....','....WWWWW..WWWWW....','....WWWwW..WwWWW....','....WWWwW..WwWWW....','....WWWWW..WWWWW....','...BBBBBB..BBBBBB...','...BBBBBB..BBBBBB...'],
  walk:['....WWWWW..WWWWW....','...WWWWW....WWWWW...','...WWWWW....WWWWW...','..WWWwW......WwWWW..','..WWWWW......WWWWW..','.WWWWW........WWWWW.','BBBBBB........BBBBBB','BBBBB..........BBBBB'],
  kick:['....WWWWW..WWWWWWWWWWBB','....WWWWW..WWWWWWWWWWBBB','....WWWWW...wWWWWWWWWBBB','....WWWwW','....WWWWW','....WWWWW','...BBBBBB','...BBBBBB']};
const JF={idle:J_HEAD.concat(J_BODY,J_LEGS.idle),walk:J_HEAD.concat(J_BODY,J_LEGS.walk),kick:J_HEAD.concat(J_ARMS,J_LEGS.kick),cheer:J_HEAD.concat(J_ARMS,J_LEGS.idle),mini:J_HEAD.concat(J_BODY.slice(0,3))};
const MUS=['...HHHHHH...','..HHHHHHHH..','..HKKKKKKH..','..KKBKKBKK..','..KKKKKKKK..','...KKBBKK...','....KKKK....','..CCCCCCCC..','.CCCCCCCCCC.','.CCCCCCCCCC.','.KCCCCCCCCK.','..CCCCCCCC..','..PPP..PPP..','..PPP..PPP..','..PPP..PPP..','.BBBB..BBBB.'];
function spr(c,rows,x,y,p,pal){for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;c.fillStyle=(pal&&pal[ch])||PAL[ch];c.fillRect(x+i*p,y+j*p,p,p)}}}
// x = centro, y = pies
function jorge(x,y,p,f){const r=JF[f||'idle'];spr(cx,r,Math.round(x-10*p),Math.round(y-r.length*p),p)}
(function(){const c=document.createElement('canvas');c.width=20*6;c.height=32*6;spr(c.getContext('2d'),JF.cheer,0,0,6);$('jImg').src=c.toDataURL()})();

// ================== DIBUJO ==================
function txt(s,x,y,size,col,align,nosh){cx.font=`bold ${size||14}px "Courier New",monospace`;cx.textAlign=align||'center';cx.textBaseline='middle';if(!nosh){cx.fillStyle='rgba(0,0,0,.8)';cx.fillText(s,x+1.5,y+1.5)}cx.fillStyle=col||'#fff';cx.fillText(s,x,y)}
function wrap(s,x,y,maxW,lh,size,col,nosh){cx.font=`bold ${size}px "Courier New",monospace`;const words=s.split(' ');let line='',lines=[];words.forEach(w=>{const t=line?line+' '+w:w;if(cx.measureText(t).width>maxW){lines.push(line);line=w}else line=t});lines.push(line);lines.forEach((l,i)=>txt(l,x,y+i*lh,size,col,'center',nosh))}
function star(x,y,r,c){cx.fillStyle=c;cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.closePath();cx.fill()}
const LC=['#ff3344','#ffd84a','#44ddff','#66ff66'];
function tree(x,y,h){cx.fillStyle='#5a3a20';cx.fillRect(x-3,y-h*.15,6,h*.15);for(let k=0;k<3;k++){const ty=y-h*.15-k*h*.25,w=h*(.6-k*.14);cx.fillStyle=k%2?'#0e8f45':'#0b7a3b';cx.beginPath();cx.moveTo(x-w/2,ty);cx.lineTo(x+w/2,ty);cx.lineTo(x,ty-h*.4);cx.fill()}
  for(let k=0;k<6;k++){cx.fillStyle=LC[(k+(T*3|0))%4];cx.fillRect(x+(k%2?h*.1:-h*.12)-1,y-h*.25-k*h*.1,3,3)}star(x,y-h*1.05,h*.1+2,'#ffd84a')}
const GIFT=[['#d4141c','#f5c542'],['#0b7a3b','#ff5a5a'],['#f5c542','#0b7a3b'],['#2a6fdb','#ffffff']];
function gift(x,y,s,t){const[b,r]=GIFT[t];cx.fillStyle=b;cx.fillRect(x-s/2,y-s*.35,s,s*.85);cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(x-s/2,y+s*.35,s,s*.15);cx.fillStyle=r;cx.fillRect(x-s*.1,y-s*.35,s*.2,s*.85);cx.fillRect(x-s/2,y-s*.35,s,s*.15);cx.fillRect(x-s*.35,y-s*.5,s*.28,s*.15);cx.fillRect(x+s*.07,y-s*.5,s*.28,s*.15)}
function trap(x,y,s){cx.fillStyle='#2b1a3a';cx.fillRect(x-s/2,y-s*.35,s,s*.85);cx.fillStyle='#6b3a8a';cx.fillRect(x-s/2,y-s*.35,s,s*.15);cx.fillStyle='#ff3030';cx.fillRect(x-s*.3,y-s*.05,s*.2,s*.15);cx.fillRect(x+s*.1,y-s*.05,s*.2,s*.15);cx.fillStyle='#fff';for(let i=0;i<4;i++)cx.fillRect(x-s*.3+i*s*.16,y+s*.22+(i%2)*s*.06,s*.1,s*.06)}
const snow=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.3?2:1,v:Math.random()*20+15}));
function drawSnow(){cx.fillStyle='#fff';snow.forEach(f=>{f.y+=f.v*DT;f.x+=Math.sin(f.y/20)*.3;if(f.y>H){f.y=-2;f.x=Math.random()*W}cx.fillRect(f.x|0,f.y|0,f.s,f.s)})}
function sky(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08142b');g.addColorStop(1,'#1d3a63');cx.fillStyle=g;cx.fillRect(0,0,W,H);for(let i=0;i<40;i++){cx.fillStyle=Math.sin(T*3+i)>.4?'#fff':'#6b7fa8';cx.fillRect((i*97)%W,(i*53)%220,1,1)}}
function lights(x,y,w){for(let i=0;i<w;i+=4){cx.fillStyle='#0b7a3b';cx.fillRect(x+i,y+Math.abs(Math.sin(i/14))*5,4,3)}for(let i=7;i<w;i+=22){cx.fillStyle=LC[((i/22|0)+(T*3|0))%4];cx.fillRect(x+i,y+Math.abs(Math.sin(i/14))*5+3,4,4)}}
function roomBg(title){cx.fillStyle='#6b1016';cx.fillRect(0,0,W,H);for(let x=0;x<W;x+=24){cx.fillStyle='#7a141b';cx.fillRect(x,44,12,H)}
  cx.fillStyle='#3a2414';cx.fillRect(0,440,W,40);cx.fillStyle='#5a3a20';for(let x=0;x<W;x+=30)cx.fillRect(x,440,28,3);
  cx.fillStyle='#0d1b2a';cx.fillRect(0,0,W,44);txt(title,W/2,22,15,'#f5c542');lights(0,44,W)}

// puntos flotantes
const pops=[];
function addScore(n,x,y,label){G.score=Math.max(0,G.score+n);pops.push({x:x||W/2,y:y||240,t:1.2,s:label||((n>0?'+':'')+n),c:n>0?'#ffd84a':'#ff6060'});hud()}
function drawPops(){for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t-=DT;p.y-=30*DT;if(p.t<=0){pops.splice(i,1);continue}cx.globalAlpha=Math.min(1,p.t*2);txt(p.s,p.x,p.y,18,p.c);cx.globalAlpha=1}}
function drawDone(d){cx.fillStyle='rgba(0,0,0,.7)';cx.fillRect(0,0,W,H);cx.fillStyle='#0b7a3b';cx.fillRect(40,150,280,190);cx.strokeStyle='#f5c542';cx.lineWidth=4;cx.strokeRect(40,150,280,190);
  star(80,180,14,'#ffd84a');star(280,180,14,'#ffd84a');txt('¡PISO '+d.f+'!',W/2,180,22,'#ffd84a');txt('COMPLETADO',W/2,208,16);
  txt('+100 por piso',W/2,245,14);if(d.bonus>0)txt('+'+d.bonus+' bono de tiempo',W/2,270,14,'#ffd84a');txt('PUNTOS: '+G.score,W/2,310,18,'#fff')}
function finishFloor(sc,bonus){if(sc.doneInfo)return;addScore(100,W/2,120);if(bonus>0)addScore(bonus,W/2,90);sc.doneInfo={bonus,f:G.floor+1};sfx('win');ui.innerHTML='';
  btn('CONTINUAR ▶','gold',()=>{const f=G.floor;G.floor++;setScene(Building(f))})}

// ================== EDIFICIO ==================
const FLOORS=['CONCÉNTRESE','DAR Y NO RECIBIR','NOCHE DE VELITAS','LABERINTO','GRAN AGUINALDO'];
const BX=60,BW=240,FH=66,GROUND=450,EX=BX+BW-19;
const floorY=i=>GROUND-(i+1)*FH;
const jFeet=i=>i<5?floorY(i)+FH-4:floorY(4)-6;
function drawBuilding(){sky();cx.fillStyle='#fff6d0';cx.beginPath();cx.arc(320,40,14,0,7);cx.fill();
  cx.fillStyle='#132845';[[0,300,48],[306,270,54],[14,350,40],[322,340,38]].forEach(([x,y,w])=>cx.fillRect(x,y,w,H-y));
  for(let i=0;i<5;i++){const y=floorY(i);cx.fillStyle=i%2?'#a01e25':'#b3242b';cx.fillRect(BX,y,BW,FH);cx.fillStyle='rgba(0,0,0,.12)';for(let r=6;r<FH;r+=8)cx.fillRect(BX,y+r,BW,1);

    for(let i=conf.length-1;i>=0;i--){const p=conf[i];p.vy+=200*dt;p.vy=Math.min(p.vy,90);p.vx*=.98;p.x+=(p.vx+Math.sin(T*3+p.r)*20)*dt;p.y+=p.vy*dt;if(p.y>H)conf.splice(i,1)}
    for(let i=fw.length-1;i>=0;i--){const p=fw[i];p.t-=dt;p.vy+=40*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0)fw.splice(i,1)}},
  draw(){const party=this.st!=='enter'&&this.st!=='ready';sky();fw.forEach(p=>{cx.globalAlpha=Math.max(0,p.t);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,3,3)});cx.globalAlpha=1;
    cx.fillStyle='#8a0f15';cx.fillRect(20,150,320,175);for(let x=20;x<340;x+=20){cx.fillStyle='#700a10';cx.fillRect(x,150,8,175)}
    cx.fillStyle='#f5c542';cx.fillRect(14,140,332,14);for(let i=0;i<16;i++){cx.fillStyle=party?LC[(i+(T*6|0))%4]:'#fff2a8';cx.fillRect(22+i*20,156,6,6)}
    if(logo.complete&&logo.naturalWidth){const s=Math.min(150/logo.naturalWidth,64/logo.naturalHeight),lw=logo.naturalWidth*s,lh=logo.naturalHeight*s;cx.fillStyle='#fff';cx.fillRect(W/2-lw/2-6,164,lw+12,lh+8);cx.drawImage(logo,W/2-logo.naturalWidth*s/2,168,logo.naturalWidth*s,logo.naturalHeight*s)}else txt('★ MISIÓN AGUINALDOS ★',W/2,200,13,'#ffd84a');
    if(party){cx.globalAlpha=.18;[[0,'#ffd84a'],[W,'#44ddff']].forEach(([sx,c],i)=>{cx.fillStyle=c;cx.beginPath();cx.moveTo(sx,0);const a=W/2+Math.sin(T*2+i*2)*120;cx.lineTo(a-50,330);cx.lineTo(a+50,330);cx.fill()});cx.globalAlpha=1}
    const pal=[{C:'#0b7a3b'},{C:'#d4141c'},{C:'#2a6fdb'}];
    [80,180,280].forEach((x,i)=>{const b=party?Math.abs(Math.sin(T*8+i))*6:0,y=322-48-b;spr(cx,MUS,x-18,y,3,pal[i]);
      if(i===0){cx.fillStyle='#efe3c0';cx.fillRect(x-24,y-2,48,5);cx.fillRect(x-14,y-12,28,11);cx.fillStyle='#1a1a1a';cx.fillRect(x-14,y-6,28,2);cx.fillRect(x-24,y+1,48,1);
        const w=24+(party?Math.sin(T*10)*6:0);cx.fillStyle='#d4141c';cx.fillRect(x-w/2,y+26,w,16);cx.fillStyle='#fff';for(let k=0;k<w;k+=5)cx.fillRect(x-w/2+k,y+26,2,16)}
      if(i===1){cx.fillStyle='#f5c542';cx.fillRect(x+3,y+16,26,4);cx.fillRect(x+26,y+12,6,12);if(party)txt('♪',x+40,y+4-((T*40)%20),14,'#ffd84a')}
      if(i===2){cx.fillStyle='#7a4a24';cx.fillRect(x-12,y+30,24,20);cx.fillStyle='#e8d2a0';cx.fillRect(x-12,y+28,24,4);cx.fillStyle='#f1c08f';const h=party&&(T*8|0)%2?4:0;cx.fillRect(x-10,y+22+h,6,4);cx.fillRect(x+4,y+26-h,6,4)}});
    cx.fillStyle='#7a4a24';cx.fillRect(10,322,340,16);cx.fillStyle='#5a3418';cx.fillRect(10,338,340,30);cx.fillStyle='#f5c542';cx.fillRect(10,322,340,3);
    cx.fillStyle='#3a3f4a';cx.fillRect(0,368,W,112);cx.fillStyle='#e8f0ff';cx.fillRect(0,368,W,4);tree(26,476,80);tree(334,476,80);
    const f=this.st==='enter'?((T*8|0)%2?'walk':'idle'):this.st==='kick'?'kick':this.st==='party'?((T*4|0)%2?'cheer':'kick'):'idle';
    jorge(this.jx,446-(this.st==='party'?Math.abs(Math.sin(T*6))*8:0),2,f);
    if(this.st==='kick'){star(this.jx+38,400,18,'#ffd84a');txt('¡PATADITA!',this.jx,370,16,'#ffd84a')}
    conf.forEach(p=>{cx.fillStyle=p.c;cx.fillRect(p.x,p.y,4,3)});drawSnow();
    if(party){const s=18+Math.sin(T*5)*2;txt('¡Felices fiestas',W/2,40,s,'#ffd84a');txt('con Tropicana!',W/2,68,s,'#fff')}
    else txt('¡Bienvenido a la tarima!',W/2,60,16,'#ffd84a')}}}

function showResult(){stopMusic();const k='patadita_resultados',arr=store.get(k,[]);arr.push({alias:G.alias,puntos:G.score,fecha:new Date().toISOString()});store.set(k,arr.slice(-30));
  const best=Math.max(...arr.filter(r=>r.alias===G.alias).map(r=>r.puntos));
  $('rA').textContent=G.alias;$('rS').textContent=G.score+' PTS';$('rB').textContent='Pisos completados: 5/5 · Tu mejor puntaje en este navegador: '+best;ui.innerHTML='';show('sEnd')}
$('bPlay').onclick=()=>{ac();$('alias').value=store.get('patadita_alias','');show('sReg');$('alias').focus()};
$('bGo').onclick=()=>{const a=$('alias').value.trim().replace(/\s+/g,' ').slice(0,12);if(!a){$('alias').focus();return}
  G.alias=a;G.score=0;G.floor=0;G.b5=false;store.set('patadita_alias',a);show(null);fit();setScene(Building(null))};
$('alias').addEventListener('keydown',e=>{if(e.key==='Enter')$('bGo').click()});
$('bRe').onclick=()=>{scene=null;show('sTitle')};

let last=0;function loop(ts){DT=Math.min(.05,(ts-last)/1000||0);last=ts;T+=DT;
  if(scene){scene.update&&scene.update(DT);scene.draw();drawPops();if(scene.doneInfo)drawDone(scene.doneInfo)}else{drawBuilding()}requestAnimationFrame(loop)}
fit();requestAnimationFrame(loop);
