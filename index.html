<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b30f16">
<title>La Patadita de la Suerte — Misión Aguinaldos</title>
<style>
:root{--red:#d4141c;--red2:#8e0b10;--green:#0b7a3b;--green2:#06502a;--gold:#f5c542;--gold2:#b8860b;--dark:#0b1626;--font:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--dark);color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#1d3a63 0%,var(--dark) 70%)}
#app{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;background:linear-gradient(#e8202a,#a50d14);font-weight:800;font-size:14px;border-bottom:3px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.5);text-shadow:0 1px 0 #5a0000}
#hud .pill{background:rgba(0,0,0,.28);padding:3px 10px;border-radius:20px}
#hud button{background:rgba(0,0,0,.25);border:2px solid #fff;color:#fff;border-radius:8px;font-size:16px;padding:2px 7px;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{touch-action:none;display:block;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 3px var(--red2),0 10px 30px rgba(0,0,0,.6)}
#ui{padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px}
.btn{font:800 15px var(--font);letter-spacing:.5px;padding:12px 18px;border:3px solid #fff;background:linear-gradient(#17a352,var(--green));color:#fff;border-radius:12px;box-shadow:0 5px 0 var(--green2),0 8px 14px rgba(0,0,0,.4);cursor:pointer;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green2)}
.btn.red{background:linear-gradient(#f0303a,var(--red));box-shadow:0 5px 0 var(--red2),0 8px 14px rgba(0,0,0,.4)}
.btn.gold{background:linear-gradient(#ffe27a,var(--gold));color:#6a0000;text-shadow:0 1px 0 #fff3b0;box-shadow:0 5px 0 var(--gold2),0 8px 14px rgba(0,0,0,.4)}
.btn.opt{flex:1 1 100%;padding:10px;font-size:15px;text-transform:none}
.btn.pad{width:64px;height:54px;font-size:22px;padding:0}
.pad-grid{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:linear-gradient(rgba(8,18,38,.55),rgba(8,18,38,.88));z-index:5}
.hidden{display:none!important}
.logo{max-width:250px;max-height:110px;background:radial-gradient(circle,#ff3a2a,#c40c12);border-radius:16px;padding:12px 20px;box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,216,74,.5)}
.jcart{height:190px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6));animation:bob 1.2s ease-in-out infinite}
h1{font-size:34px;font-weight:900;color:var(--gold);line-height:1.05;letter-spacing:1px;-webkit-text-stroke:2px #6a0000;text-shadow:0 4px 0 #6a0000,0 0 24px rgba(255,200,60,.5)}
h2{font-size:17px;color:#fff;letter-spacing:3px;text-shadow:0 2px 0 #000}
.jimg{width:110px;image-rendering:pixelated;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
input{font:800 20px var(--font);padding:12px;width:250px;text-align:center;border:3px solid var(--gold);border-radius:12px;background:#fff;color:#000}
.small{font-size:13px;opacity:.85;max-width:320px}
.big{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #6a0000}
</style>
</head>
<body>
<div id="app">
  <div id="hud" class="hidden"><span class="pill" id="hA"></span><span id="hF"></span><span class="pill" id="hS"></span><button id="mute" aria-label="Sonido">🔊</button></div>
  <div id="stage"><canvas id="cv" width="360" height="480"></canvas></div>
  <div id="ui"></div>

  <div id="sTitle" class="screen hidden">
    <img class="logo" src="assets/logo-tropicana-amarillo.png" alt="Tropicana">
    <h1>LA PATADITA<br>DE LA SUERTE</h1>
    <h2>★ MISIÓN AGUINALDOS ★</h2>
    <img class="jcart" id="jImg" alt="Jorge Barón">
    <button class="btn gold" id="bPlay">JUGAR</button>
    <p class="small">Supera los 5 pisos del edificio navideño y llega a la tarima.</p>
  </div>

  <div id="sReg" class="screen hidden">
    <h2>¿CÓMO TE LLAMAMOS?</h2>
    <input id="alias" maxlength="12" placeholder="Tu alias" autocomplete="off">
    <button class="btn gold" id="bGo">¡A JUGAR!</button>
    <p class="small">Solo alias. No pedimos datos personales. Se guarda únicamente en este navegador.</p>
  </div>

  <div id="sEnd" class="screen hidden">
    <h1>¡MISIÓN<br>CUMPLIDA!</h1>
    <h2 id="rA"></h2>
    <div class="big" id="rS"></div>
    <p id="rB" class="small"></p>
    <button class="btn red" id="bRe">REINICIAR</button>
  </div>
</div>

<script>
'use strict';
// ================== BASE ==================
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),W=360,H=480,ui=$('ui');
const FONT='"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
const G={alias:'',score:0,floor:0,muted:false,b5:false};
let scene=null,T=0,DT=0;
const logo=new Image();logo.src='assets/logo-tropicana-amarillo.png';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
G.muted=store.get('patadita_mute',false);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

let R=2;function fit(){const st=$('stage');const s=Math.min((st.clientWidth-12)/W,(st.clientHeight-12)/H),cw=W*s|0;cv.style.width=cw+'px';cv.style.height=(H*s|0)+'px';
  let r=Math.ceil(cw*(window.devicePixelRatio||1)/W);r=r<=2?2:r<=3?3:4;if(cv.width!==W*r){R=r;cv.width=W*R;cv.height=H*R;VG=null}cx.setTransform(R,0,0,R,0,0)}
addEventListener('resize',fit);
new ResizeObserver(fit).observe($('stage'));

function btn(label,cls,fn,parent){const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=label;b.onclick=()=>{ac();fn(b)};(parent||ui).appendChild(b);return b}
function setScene(s){scene=s;ui.innerHTML='';s.init&&s.init();hud()}
function show(id){['sTitle','sReg','sEnd'].forEach(s=>$(s).classList.toggle('hidden',s!==id));$('hud').classList.toggle('hidden',!!id)}
function hud(){$('hA').textContent='🎄 '+G.alias;$('hF').textContent=G.floor<5?`PISO ${G.floor+1}/5`:'AZOTEA';$('hS').textContent='★ '+G.score;$('mute').textContent=G.muted?'🔇':'🔊'}

// input
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{ac();const p=cpos(e);scene&&scene.down&&scene.down(p.x,p.y)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){const p=cpos(e);scene&&scene.move&&scene.move(p.x,p.y)}});
cv.addEventListener('pointerup',e=>{const p=cpos(e);scene&&scene.up&&scene.up(p.x,p.y)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;ac();if(scene&&scene.key){scene.key(e.key,true);if(e.key.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>scene&&scene.key&&scene.key(e.key,false));
// el navegador solo permite audio tras la primera interacción: ahí arranca la música ambiente
addEventListener('pointerdown',()=>{if(ac()&&!mus.name)startMusic('amb')});

// ================== AUDIO (Web Audio, música 100% original) ==================
let AC=null,master=null,nbuf=null,mus={name:null};
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=G.muted?0:.6;master.connect(AC.destination);
  nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type,v,dest,att){if(!AC)return;att=att||.01;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.12,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,att+.02));o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+Math.max(d,att+.02)+.05)}
function noise(t,d,v,dest){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='highpass';f.frequency.value=6500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.02)}
function drum(t,dest,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);g.gain.setValueAtTime(v||.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+.3)}
// Música ambiente de diciembre (original): celesta, colchón suave, bajo y cascabeles
const AMB_CH=[[48,52,55],[45,48,52],[41,45,48],[43,47,50],[48,52,55],[40,43,47],[41,45,48],[48,52,55]];
const AMB_MEL=[[[76,1],[79,1],[77,.5],[76,.5],[74,1]],[[72,1.5],[74,.5],[76,2]],[[77,1],[81,1],[79,.5],[77,.5],[76,1]],[[74,3],[0,1]],
  [[76,1],[79,1],[84,1],[83,.5],[81,.5]],[[79,1.5],[76,.5],[71,2]],[[72,.5],[74,.5],[76,1],[77,.5],[76,.5],[74,1]],[[72,3],[0,1]]];
function ambBar(i,t,q,b){const c=AMB_CH[i];c.forEach(m=>tone(mf(m),t,4*q,'sine',.035,b,.5));
  tone(mf(c[0]-12),t,q*1.8,'triangle',.16,b);tone(mf(c[2]-12),t+2*q,q*1.8,'triangle',.12,b);
  for(let e=0;e<8;e++)noise(t+e*q/2,.05,e%4===2?.045:.018,b);
  let mt=t;AMB_MEL[i].forEach(([m,d])=>{if(m){tone(mf(m),mt,d*q*1.3,'sine',.11,b);tone(mf(m+12),mt,.3,'triangle',.03,b)}mt+=d*q})}
// Cumbia navideña (original) para la tarima
const TR_CH=[[43,47,50],[48,52,55],[50,54,57],[43,47,50],[40,43,47],[48,52,55],[50,54,57],[43,47,50]];
const TR_MEL=[[[71,.5],[74,.5],[79,1],[78,.5],[76,.5],[74,1]],[[72,.5],[76,.5],[79,1],[76,1],[72,1]],[[74,.5],[78,.5],[81,1],[79,.5],[78,.5],[76,1]],[[79,1.5],[74,.5],[71,2]],
  [[76,.5],[79,.5],[83,1],[81,.5],[79,.5],[76,1]],[[76,.5],[79,.5],[84,1],[83,.5],[81,.5],[79,1]],[[78,.5],[79,.5],[81,.5],[78,.5],[74,1],[76,.5],[78,.5]],[[79,2],[0,2]]];
function tropBar(i,t,q,b){const c=TR_CH[i];
  tone(mf(c[0]),t,q*.9,'triangle',.35,b);tone(mf(c[2]),t+2*q,q*.9,'triangle',.3,b);tone(mf(c[0]+12),t+3.5*q,q*.4,'triangle',.25,b);
  for(let e=0;e<8;e++)noise(t+e*q/2,.05,e%2?.12:.05,b);drum(t+q,b,.35);drum(t+3*q,b,.35);
  [.5,1.5,2.5,3.5].forEach(k=>c.forEach(m=>tone(mf(m+12),t+k*q,.12,'square',.025,b)));
  let mt=t;TR_MEL[i].forEach(([m,d])=>{if(m){tone(mf(m),mt,d*q*.9,'square',.07,b);tone(mf(m+12),mt,.2,'triangle',.04,b)}mt+=d*q})}
const SONGS={amb:{bpm:92,bar:ambBar,vol:.7},trop:{bpm:104,bar:tropBar,vol:1}};
function startMusic(name){if(!ac()||mus.name===name)return;stopMusic();const s=SONGS[name],b=AC.createGain();b.gain.setValueAtTime(0,AC.currentTime);b.gain.linearRampToValueAtTime(s.vol,AC.currentTime+1.2);b.connect(master);
  mus={name,bus:b,bar:0,next:AC.currentTime+.1};const q=60/s.bpm;const sch=()=>{while(mus.bus===b&&mus.next<AC.currentTime+.6){s.bar(mus.bar%8,mus.next,q,b);mus.next+=4*q;mus.bar++}};sch();mus.timer=setInterval(sch,150)}
function stopMusic(){if(mus.timer)clearInterval(mus.timer);if(mus.bus&&AC){const b=mus.bus;b.gain.cancelScheduledValues(AC.currentTime);b.gain.setValueAtTime(b.gain.value,AC.currentTime);b.gain.linearRampToValueAtTime(0,AC.currentTime+.4);setTimeout(()=>b.disconnect(),500)}mus={name:null}}
function sfx(n){if(!ac())return;const t=AC.currentTime;const f={
  good:()=>{tone(988,t,.08);tone(1319,t+.08,.18)},bad:()=>tone(140,t,.3,'sawtooth',.12),
  flip:()=>tone(660,t,.06,'square',.07),step:()=>tone(520,t,.05,'square',.05),
  win:()=>[72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*.1,.25,'square',.12)),
  kick:()=>{drum(t,0,.8);noise(t,.15,.3)},ding:()=>{tone(1568,t,.5,'triangle',.18);tone(2093,t+.12,.5,'triangle',.12)}}[n];f&&f()}
$('mute').onclick=()=>{G.muted=!G.muted;store.set('patadita_mute',G.muted);if(master)master.gain.value=G.muted?0:.6;hud()};

// ================== SPRITES PIXEL ART (con contorno y sombreado automáticos) ==================
const PAL={S:'#eef0f2',s:'#a9b0b8',K:'#d99a6c',k:'#9a5e3a',B:'#1e1a22',W:'#ffffff',w:'#c3cad3',g:'#b8c0ca',M:'#6a1010',R:'#d4141c'};
const J_HEAD=['.......ssSSSs.......','.....sSSSSSSSSs.....','....sSSSSSSSSSSs....','...sSSSSSSSSSSSSs...','...sSKKKKKKKKKKSs...','...sKssKKKKKKssKs...','...KKBWKKKKKKBWKK...','..kKKKKKKKKKKKKKKk..','...KKKKKKkkKKKKKK...','...KKKMWWWWWWMKKK...','....KKMWWWWWWMKK....','.....KKMMMMMMKK.....','......KKKKKKKK......'];
const J_BODY=['.......wWWWWw.......','....WWWgWWWWgWWW....','..WWWWWgWWWWgWWWWW..','.WWWWWWgWWWWgWWWWWW.','.WWwWWWWgWWgWWWWwWW.','.WWwWWWWWggWWWWWwWW.','.WWwWWWWWWWWWWWWwWW.','.KKwWWWWWgWWWWWWwKK.','.KK.WWWWWgWWWWWW.KK.','....WWWWWgWWWWWW....','....wWWWWWWWWWWw....'];
const J_ARMS=['.KK....wWWWWw....KK.','.KKWWWWgWWWWgWWWWKK.','..WWWWWgWWWWgWWWWW..','...WWWWgWWWWgWWWW...','...WwWWWgWWgWWWwW...','...WwWWWWggWWWWwW...','...WwWWWWWWWWWWwW...','...WwWWWWgWWWWWwW...','....WWWWWgWWWWWW....','....WWWWWgWWWWWW....','....wWWWWWWWWWWw....'];
const J_LEGS={idle:['....WWWWW..WWWWW....','....WWWWW..WWWWW....','....WWWWW..WWWWW....','....WWWwW..WwWWW....','....WWWwW..WwWWW....','....WWWWW..WWWWW....','...BBBBBB..BBBBBB...','...BBBBBB..BBBBBB...'],
  walk:['....WWWWW..WWWWW....','...WWWWW....WWWWW...','...WWWWW....WWWWW...','..WWWwW......WwWWW..','..WWWWW......WWWWW..','.WWWWW........WWWWW.','BBBBBB........BBBBBB','BBBBB..........BBBBB'],
  kick:['....WWWWW..WWWWWWWWWWBB','....WWWWW..WWWWWWWWWWBBB','....WWWWW...wWWWWWWWWBBB','....WWWwW','....WWWWW','....WWWWW','...BBBBBB','...BBBBBB']};
const JF={idle:J_HEAD.concat(J_BODY,J_LEGS.idle),walk:J_HEAD.concat(J_BODY,J_LEGS.walk),kick:J_HEAD.concat(J_ARMS,J_LEGS.kick),cheer:J_HEAD.concat(J_ARMS,J_LEGS.idle),mini:J_HEAD.concat(J_BODY.slice(0,3))};
// músicos: misma calidad que Jorge, recoloreados
const sect=(rows,m)=>rows.map(r=>r.replace(/./g,ch=>m[ch]||ch));
const MH=sect(J_HEAD,{S:'H',s:'h'}),MBd=sect(J_BODY,{W:'C',w:'c',g:'c'}),MAr=sect(J_ARMS,{W:'C',w:'c',g:'c'}),MLg=sect(J_LEGS.idle,{W:'P',w:'p'});
const MUSF={idle:MH.concat(MBd,MLg),cheer:MH.concat(MAr,MLg)};
const MPAL=[{H:'#1a1414',h:'#3a2a20',C:'#f4f1e6',c:'#cfc6aa',P:'#1c2c4c',p:'#0f1a30',K:'#c98a5a',k:'#8a5530'},
  {H:'#2a1a10',h:'#4a3020',C:'#d4141c',c:'#9a0e14',P:'#262626',p:'#141414',K:'#e0a878',k:'#a06a40'},
  {H:'#111111',h:'#2a2a2a',C:'#1f6fd8',c:'#164c99',P:'#f4f1e6',p:'#cfc6aa',K:'#8a5a3a',k:'#5a3820'}];
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=k>0?255:0,a=Math.abs(k);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
const SC=new Map();
function sprite(rows,pal){let m=SC.get(rows);if(!m){m=new Map();SC.set(rows,m)}const key=pal||PAL;let c=m.get(key);if(c)return c;
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d'),img=g.createImageData(w+2,h+2),d=img.data;
  const at=(i,j)=>{const r=rows[j];const ch=r&&r[i];return ch&&ch!=='.'?ch:null};
  const put=(x,y,hex)=>{const n=parseInt(hex.slice(1),16),o=(y*(w+2)+x)*4;d[o]=n>>16;d[o+1]=n>>8&255;d[o+2]=n&255;d[o+3]=255};
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const ch=at(x,y);
    if(ch){let hex=(pal&&pal[ch])||PAL[ch];if(!at(x+1,y)||!at(x,y+1))hex=shade(hex,-.2);else if((!at(x-1,y)||!at(x,y-1))&&ch!=='B')hex=shade(hex,.15);put(x+1,y+1,hex)}
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1))put(x+1,y+1,'#1a0d14')}
  g.putImageData(img,0,0);m.set(key,c);return c}
function spr(c,rows,x,y,p,pal){const s=sprite(rows,pal);c.imageSmoothingEnabled=false;c.drawImage(s,x-p,y-p,s.width*p,s.height*p)}
function shadowAt(x,y,w){cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x,y,w,w*.25,0,0,7);cx.fill()}
// x = centro, y = pies
function jorge(x,y,p,f){const r=JF[f||'idle'];shadowAt(x,y,9*p);spr(cx,r,Math.round(x-10*p),Math.round(y-r.length*p),p)}
function musician(i,x,y,p,f){const r=MUSF[f||'idle'];shadowAt(x,y,9*p);spr(cx,r,Math.round(x-10*p),Math.round(y-r.length*p),p,MPAL[i])}


// ================== DIBUJO ==================
function txt(s,x,y,size,col,align,nosh){size=size||14;cx.font=`800 ${size}px ${FONT}`;cx.textAlign=align||'center';cx.textBaseline='middle';
  if(!nosh){cx.lineJoin='round';cx.lineWidth=Math.max(2.5,size/4.5);cx.strokeStyle='rgba(20,6,12,.9)';cx.strokeText(s,x,y)}cx.fillStyle=col||'#fff';cx.fillText(s,x,y)}
function wrap(s,x,y,maxW,lh,size,col,nosh){cx.font=`800 ${size}px ${FONT}`;const words=s.split(' ');let line='',lines=[];words.forEach(w=>{const t=line?line+' '+w:w;if(cx.measureText(t).width>maxW){lines.push(line);line=w}else line=t});lines.push(line);lines.forEach((l,i)=>txt(l,x,y+i*lh,size,col,'center',nosh))}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
